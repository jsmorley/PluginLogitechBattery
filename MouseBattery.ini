[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Logitech Mouse Battery
Description=Battery status of a Logitech wireless mouse via the LogitechBattery plugin

; ---- Measures: every measure shares one background poller ----
[mName]
Measure=Plugin
Plugin=LogitechBattery
Type=Name
PollInterval=60
; DeviceName=MX Master   ; pick a device by name if you have several
; DeviceIndex=1          ; ...or by position
; Debug=1                ; log discovery to the Rainmeter log (turn debug logging on)

[mPercent]
Measure=Plugin
Plugin=LogitechBattery
Type=Percent
IfCondition=(mPercent < 20) && (mConnected = 1)
IfTrueAction=[!SetOption mBar BarColor "235,80,80"][!UpdateMeter mBar][!Redraw]
IfFalseAction=[!SetOption mBar BarColor "110,200,120"][!UpdateMeter mBar][!Redraw]

[mStatus]
Measure=Plugin
Plugin=LogitechBattery
Type=Status

[mConnected]
Measure=Plugin
Plugin=LogitechBattery
Type=Connected

; ---- Meters ----
[Background]
Meter=Shape
Shape=Rectangle 0,0,220,74,8 | Fill Color 25,25,30,220 | StrokeWidth 0

[mTitle]
Meter=String
MeasureName=mName
Text=%1
X=12
Y=8
FontColor=230,230,235
FontSize=10
StringStyle=Bold
AntiAlias=1
ClipString=1
W=196

[mBar]
Meter=Bar
MeasureName=mPercent
X=12
Y=32
W=196
H=8
BarColor=110,200,120
SolidColor=60,60,66
BarOrientation=Horizontal

[mLabel]
Meter=String
MeasureName=mPercent
MeasureName2=mStatus
MeasureName3=mConnected
Text=%1%  -  %2
X=12
Y=46
FontColor=200,200,205
FontSize=9
AntiAlias=1
DynamicVariables=1
; Dim the text when the mouse is off / out of range (shows last known value)
IfCondition=mConnected = 0
IfTrueAction=[!SetOption mLabel FontColor "140,140,145"]
IfFalseAction=[!SetOption mLabel FontColor "200,200,205"]
